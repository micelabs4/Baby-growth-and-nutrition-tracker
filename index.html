/* ============================================================================
   GROWTH ENGINE — pure, deterministic, auditable
============================================================================ */
function lookupLMS(table, x) {
  if (x <= table[0][0]) return table[0];
  if (x >= table[table.length - 1][0]) return table[table.length - 1];
  for (let i = 0; i < table.length - 1; i++) {
    const [x0, L0, M0, S0] = table[i];
    const [x1, L1, M1, S1] = table[i + 1];
    if (x >= x0 && x <= x1) {
      const f = (x - x0) / (x1 - x0);
      return [x, L0 + f * (L1 - L0), M0 + f * (M1 - M0), S0 + f * (S1 - S0)];
    }
  }
  return table[table.length - 1];
}
function zFromLMS(value, lms) {
  const [, L, M, S] = lms;
  if (Math.abs(L) < 1e-6) return Math.log(value / M) / S;
  return (Math.pow(value / M, L) - 1) / (L * S);
}
function valueFromZ(z, lms) {
  const [, L, M, S] = lms;
  if (Math.abs(L) < 1e-6) return M * Math.exp(S * z);
  return M * Math.pow(1 + L * S * z, 1 / L);
}
function erf(x) {
  const sign = x < 0 ? -1 : 1;
  x = Math.abs(x);
  const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741, a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
  const t = 1 / (1 + p * x);
  const y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
  return sign * y;
}
function percentileFromZ(z) { return 50 * (1 + erf(z / Math.sqrt(2))); }
function ordinal(n) {
  const r = Math.round(n);
  const v = r % 100;
  const s = ["th", "st", "nd", "rd"];
  return r + (s[(v - 20) % 10] || s[v] || s[0]);
}

  const t = TABLES[sex];

/* ============================================================================
   MULTI-PATIENT STORAGE
   Hospital staff can see every registered patient; a parent's device is
   linked to exactly one. This is a prototype-level persistence layer using
   the browser's own localStorage -- it keeps data on THIS device/browser
   only. It is NOT a shared hospital database: a patient registered on one
   computer will not appear on another. A real deployment would need a
   backend with proper authentication before this could be used across
   multiple devices or trusted for real records.
============================================================================ */
const STORAGE_KEY = "bgn_patients_v1";
const ROLE_KEY = "bgn_role_v1";
const MY_PATIENT_KEY = "bgn_my_patient_id_v1";
function loadPatients() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function savePatients(patients) {
  try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(patients)); } catch (e) { /* storage unavailable — continue in-memory only */ }
}
function getStoredRole() { try { return window.localStorage.getItem(ROLE_KEY); } catch (e) { return null; } }
function setStoredRole(r) { try { window.localStorage.setItem(ROLE_KEY, r); } catch (e) {} }
function clearStoredRole() { try { window.localStorage.removeItem(ROLE_KEY); window.localStorage.removeItem(MY_PATIENT_KEY); } catch (e) {} }
function getMyPatientId() { try { return window.localStorage.getItem(MY_PATIENT_KEY); } catch (e) { return null; } }
function setMyPatientId(id) { try { window.localStorage.setItem(MY_PATIENT_KEY, id); } catch (e) {} }
function newPatientId() { return "pt_" + Math.random().toString(36).slice(2, 10); }
function generatePatientCode(existingCodes) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no ambiguous 0/O, 1/I
  let code;
  do { code = Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join(""); }
  while (existingCodes.includes(code));
  return code;
}

   SMALL UI ATOMS — fewer variants, used sparingly, so a badge or a tint
   always means something rather than decorating every card.
============================================================================ */
function Badge({ children, tone = "neutral" }) {
  const map = {
    primary: { bg: COLORS.primarySoft, fg: COLORS.primaryDeep },
    accent: { bg: COLORS.accentSoft, fg: "#8A5A16" },
    attention: { bg: COLORS.attentionSoft, fg: COLORS.attention },
    neutral: { bg: "#EDEAE0", fg: COLORS.inkSoft },
  };
  const c = map[tone];
  return (
    <span style={{ background: c.bg, color: c.fg, fontSize: 11, fontWeight: 600, padding: "3px 9px", borderRadius: 999, letterSpacing: 0.2, whiteSpace: "nowrap" }}>
      {children}
    </span>
  );
}
function TrendGlyph({ direction, size = 15 }) {
  if (direction === "up") return <TrendingUp size={size} color={COLORS.primary} />;
  if (direction === "down") return <TrendingDown size={size} color={COLORS.attention} />;
  return <Minus size={size} color={COLORS.inkFaint} />;
}
function trendWord(direction) { return direction === "up" ? "Rising" : direction === "down" ? "Declining" : "Stable"; }
function Card({ children, style, onClick, accent }) {
  return (
    <div onClick={onClick}

}
function SectionLabel({ children }) {

}
function PrimaryButton({ children, onClick, disabled, style, icon: Icon }) {

        gap: 8, width: "100%", cursor: disabled ? "not-allowed" : "pointer", ...style }}>

}
function GhostButton({ children, onClick, style, icon: Icon }) {

function PatientRosterRow({ patient, onClick }) {
  const latest = patient.measurements[patient.measurements.length - 1];
  const first = patient.measurements[0];
  const g = computeGrowth(patient.baby.sex, latest.ageMonths, latest.weight, latest.length, latest.hc);
  const gFirst = computeGrowth(patient.baby.sex, first.ageMonths, first.weight, first.length, first.hc);
  const flagged = patient.measurements.length > 1 && (gFirst.zWeight - g.zWeight) > 0.6;
  return (
    <Card onClick={onClick} style={{ marginBottom: 10, cursor: "pointer" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>

  );
}

function AddMeasurementFlow({ baby, onClose, onSave }) {
  const [step, setStep] = useState("form");
  const [pending, setPending] = useState(null);

  function handleSubmit(m) {
    const ageMonths = ageInMonths(baby.dob, m.date);
    const correctedMonths = correctedAgeMonths(ageMonths, baby.gestationalAgeWeeks, baby.preterm);
    const growth = computeGrowth(baby.sex, correctedMonths, m.weight, m.length, m.hc);
    setPending({ m, ageMonths, correctedMonths, growth });
    setStep("result");
  }
  function handleConfirm() {
    onSave({
      ageMonths: round1(pending.ageMonths), label: `${round1(pending.ageMonths)} months`,
      weight: pending.m.weight, length: pending.m.length, hc: pending.m.hc,
      source: "Parent entered", confidence: "Medium",
    });
  }

  return (
    <div style={{ position: "absolute", inset: 0, background: COLORS.paper, zIndex: 20, display: "flex", flexDirection: "column" }}>
      <div style={{ padding: "16px 18px", borderBottom: `1px solid ${COLORS.border}`, display: "flex", alignItems: "center", gap: 10 }}>
        <button onClick={onClose} className="bgn-tap" style={{ background: "none", border: "none", cursor: "pointer" }}><ArrowLeft size={20} /></button>
        <div className="bgn-serif" style={{ fontSize: 16, fontWeight: 600 }}>Add measurement</div>
      </div>
      <div className="bgn-scroll" style={{ flex: 1, overflowY: "auto", padding: 18 }}>
        {step === "form" && (
          <MeasurementFormScreen baby={baby} title="New measurement" subtitle={`for ${baby.name}`} onBack={onClose} onSubmit={handleSubmit} />
        )}
        {step === "result" && pending && (
          <ResultScreen baby={baby} measurement={pending.m} growth={pending.growth} ageMonths={pending.ageMonths}
            correctedMonths={pending.correctedMonths} onContinue={handleConfirm} continueLabel="Save to growth chart" />
        )}
      </div>
    </div>
  );
}

const INDICATOR_CONFIG = {
  weight: { key: "wfa", label: "Weight-for-age", unit: "kg", xLabel: "Age (months)", field: "weight", getX: (m) => m.ageMonths, xMin: 0, xMax: 24, step: 1 },
  length: { key: "lhfa", label: "Length-for-age", unit: "cm", xLabel: "Age (months)", field: "length", getX: (m) => m.ageMonths, xMin: 0, xMax: 24, step: 1 },
  hc:     { key: "hcfa", label: "Head circumference-for-age", unit: "cm", xLabel: "Age (months)", field: "hc", getX: (m) => m.ageMonths, xMin: 0, xMax: 24, step: 1 },
  wfl:    { key: "wfl", label: "Weight-for-length", unit: "kg", xLabel: "Length (cm)", field: "weight", getX: (m) => m.length, xMin: 45, xMax: 85, step: 1 },
  bmi:    { key: "bmifa", label: "BMI-for-age", unit: "kg/m²", xLabel: "Age (months)", field: "bmi", getX: (m) => m.ageMonths, xMin: 0, xMax: 24, step: 1 },
};

function TrajectoryChart({ indicatorId, measurements, sex }) {
  const cfg = INDICATOR_CONFIG[indicatorId];
  const table = TABLES[sex][cfg.key];
  const xs = [];
  for (let x = cfg.xMin; x <= cfg.xMax; x += cfg.step) xs.push(x);
  const bandData = xs.map((x) => {
    const lms = lookupLMS(table, x);
    return { x, low: round1(valueFromZ(-2, lms)), mid: round1(valueFromZ(0, lms)), high: round1(valueFromZ(2, lms)) };
  });
  const childPoints = measurements.map((m) => ({ x: cfg.getX(m), y: m[cfg.field] })).sort((a, b) => a.x - b.x);
  return (
    <div>
      <ResponsiveContainer width="100%" height={210}>
        <ComposedChart margin={{ top: 8, right: 12, left: -18, bottom: 4 }}>
          <CartesianGrid stroke={COLORS.gridLine} strokeDasharray="2 4" />
          <XAxis dataKey="x" type="number" domain={[cfg.xMin, cfg.xMax]} tick={{ fontSize: 10, fill: COLORS.inkSoft }}
            label={{ value: cfg.xLabel, position: "insideBottom", offset: -2, fontSize: 10, fill: COLORS.inkSoft }} />
          <YAxis type="number" tick={{ fontSize: 10, fill: COLORS.inkSoft }} width={34}
            label={{ value: cfg.unit, angle: -90, position: "insideLeft", fontSize: 10, fill: COLORS.inkSoft }} />
          <Tooltip contentStyle={{ fontSize: 12, borderRadius: 8, border: `1px solid ${COLORS.border}` }}
            formatter={(v, name) => [`${round1(v)} ${cfg.unit}`, name]} labelFormatter={(l) => `${cfg.xLabel}: ${l}`} />
          <Line data={bandData} dataKey="low" stroke={COLORS.band} strokeWidth={1} dot={false} isAnimationActive={false} name="3rd percentile" />
          <Line data={bandData} dataKey="mid" stroke={COLORS.primary} strokeWidth={1.5} strokeDasharray="4 3" dot={false} isAnimationActive={false} name="Median (50th)" />
          <Line data={bandData} dataKey="high" stroke={COLORS.band} strokeWidth={1} dot={false} isAnimationActive={false} name="97th percentile" />
          <Line data={childPoints} dataKey="y" stroke={COLORS.accent} strokeWidth={2.5}
            dot={{ r: 4, fill: COLORS.accent, stroke: "#fff", strokeWidth: 1 }} isAnimationActive={false} name={"Recorded"} />
        </ComposedChart>
      </ResponsiveContainer>
      <div style={{ fontSize: 11, color: COLORS.inkFaint, marginTop: 2, lineHeight: 1.5 }}>
        Grey lines: WHO reference range (3rd–97th percentile) and median for {sex === "M" ? "boys" : "girls"}. Marigold: recorded measurements.
      </div>
    </div>
  );
}

function GrowthScreen({ baby, growthResults, viewMode, onAddMeasurement }) {
  const [indicator, setIndicator] = useState("weight");
  const [showClinical, setShowClinical] = useState(false);
  const latest = growthResults[growthResults.length - 1];
  const prev = growthResults[growthResults.length - 2] || latest;
  const singlePoint = growthResults.length < 2;

  const rows = [
    { key: "weight", label: "Weight-for-age", z: latest.zWeight, p: latest.pWeight, dz: latest.zWeight - prev.zWeight },
    { key: "length", label: "Length-for-age", z: latest.zLength, p: latest.pLength, dz: latest.zLength - prev.zLength },
    { key: "wfl",    label: "Weight-for-length", z: latest.zWfl, p: latest.pWfl, dz: latest.zWfl - prev.zWfl },
    { key: "bmi",    label: "BMI-for-age", z: latest.zBmi, p: latest.pBmi, dz: latest.zBmi - prev.zBmi },
    { key: "hc",     label: "Head circumference-for-age", z: latest.zHc, p: latest.pHc, dz: latest.zHc - prev.zHc },
  ].map((r) => ({ ...r, trend: r.dz > 0.2 ? "up" : r.dz < -0.2 ? "down" : "flat" }));

  const overallFirst = growthResults[0];
  const weightDelta = latest.zWeight - overallFirst.zWeight;
  const patternText = singlePoint
    ? "This is the first recorded measurement — a trend will appear once another is added."
    : Math.abs(weightDelta) > 0.6
    ? `Weight-for-age has moved ${weightDelta < 0 ? "downward" : "upward"} over the ${growthResults.length} recorded measurements, while length and head circumference have tracked closer to birth trajectory.`
    : "Growth pattern appears relatively stable across weight, length and head circumference.";

  return (
    <div className="bgn-fade-in" style={{ paddingBottom: 12 }}>
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <GrowthOverviewCard label="Weight" percentile={latest.pWeight} z={latest.zWeight} trend={rows[0].trend} viewMode={viewMode} active={indicator === "weight"} onClick={() => setIndicator("weight")} />
        <GrowthOverviewCard label="Length" percentile={latest.pLength} z={latest.zLength} trend={rows[1].trend} viewMode={viewMode} active={indicator === "length"} onClick={() => setIndicator("length")} />
        <GrowthOverviewCard label="Head circ." percentile={latest.pHc} z={latest.zHc} trend={rows[3].trend} viewMode={viewMode} active={indicator === "hc"} onClick={() => setIndicator("hc")} />
      </div>

      <Card style={{ marginBottom: 14 }}>
        <div style={{ display: "flex", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
          {Object.entries(INDICATOR_CONFIG).map(([id, c]) => (
            <button key={id} onClick={() => setIndicator(id)} className="bgn-tap"
              style={{ fontSize: 11.5, fontWeight: 600, padding: "6px 10px", borderRadius: 999, cursor: "pointer",
                border: `1px solid ${indicator === id ? COLORS.primary : COLORS.border}`,
                background: indicator === id ? COLORS.primary : "transparent", color: indicator === id ? "#fff" : COLORS.inkSoft }}>
              {c.label}
            </button>
          ))}
        </div>
        <TrajectoryChart indicatorId={indicator} measurements={growthResults} sex={baby.sex} />
      </Card>

      <Card accent={COLORS.primary} style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.primaryDeep, marginBottom: 4 }}>Growth pattern</div>
        <div style={{ fontSize: 13, color: COLORS.ink, lineHeight: 1.5 }}>{patternText}</div>
      </Card>

      <GhostButton icon={Plus} style={{ width: "100%", marginBottom: 14 }} onClick={onAddMeasurement}>Add measurement</GhostButton>

      {viewMode === "clinical" && (
        <Card>
          <button onClick={() => setShowClinical((s) => !s)} className="bgn-tap"
            style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", background: "none", border: "none", cursor: "pointer", padding: 0 }}>
            <span style={{ fontWeight: 600, fontSize: 14, display: "flex", alignItems: "center", gap: 6 }}><Stethoscope size={15} /> Clinical detail</span>
            <ChevronDown size={18} style={{ transform: showClinical ? "rotate(180deg)" : "none", transition: "0.15s" }} />
          </button>
          {showClinical && (
            <div className="bgn-fade-in" style={{ marginTop: 12 }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
                <thead>
                  <tr style={{ textAlign: "left", color: COLORS.inkFaint, fontSize: 10.5 }}>
                    <th style={{ paddingBottom: 6, fontWeight: 600 }}>Measurement</th>
                    <th style={{ paddingBottom: 6, fontWeight: 600, textAlign: "right" }}>Z-score</th>
                    <th style={{ paddingBottom: 6, fontWeight: 600, textAlign: "right" }}>Percentile</th>
                    <th style={{ paddingBottom: 6, fontWeight: 600, textAlign: "center" }}>Trend</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r) => (
                    <tr key={r.key} style={{ borderTop: `1px solid ${COLORS.border}` }}>
                      <td style={{ padding: "8px 0" }}>{r.label}</td>
                      <td style={{ textAlign: "right" }}>{r.z >= 0 ? "+" : ""}{round1(r.z)}</td>
                      <td style={{ textAlign: "right" }}>{ordinal(r.p)}</td>
                      <td style={{ textAlign: "center" }}><TrendGlyph direction={r.trend} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 12, lineHeight: 1.6 }}>
                Computed via the WHO Child Growth Standards (2006) LMS method: Z = (((measurement ÷ M)^L) − 1) ÷ (L × S),
                using {baby.name}'s recorded {baby.preterm ? "corrected " : ""}age and sex. Raw measurements are stored alongside every calculated value.
              </div>
            </div>
          )}
        </Card>
      )}
    </div>
  );
}

  const pct = target > 0 ? Math.min(999, Math.round((consumed / target) * 100)) : 0;
  const barPct = Math.min(100, pct);
  const color = pct >= 85 ? COLORS.primary : pct >= 60 ? COLORS.accent : COLORS.attention;
  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 4 }}>
        <span style={{ fontWeight: 600 }}>{label}</span>

        <div style={{ width: `${barPct}%`, height: "100%", background: color, borderRadius: 999 }} />

}

function AddMealFlow({ onClose, onSave }) {
  const [step, setStep] = useState("type");
  const [mealType, setMealType] = useState("breakfast");
  const [mode, setMode] = useState("manual");
  const [items, setItems] = useState([]);
  const [draftFood, setDraftFood] = useState("rice");
  const [draftQty, setDraftQty] = useState(1);
  const [draftUnit, setDraftUnit] = useState("bowl");
  const [aiText, setAiText] = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState("");
  const [staged, setStaged] = useState(null);

  function addManualItem() { setItems((prev) => [...prev, { food: draftFood, qty: Number(draftQty) || 1, unit: draftUnit, pct: 100 }]); }
  function removeItem(idx) { setItems((prev) => prev.filter((_, i) => i !== idx)); }
  function updatePct(idx, pct) { setItems((prev) => prev.map((it, i) => (i === idx ? { ...it, pct } : it))); }

  async function runAiParse() {
    setAiLoading(true); setAiError(""); setStaged(null);
    try {
      const foodList = Object.entries(FOOD_DB).map(([id, f]) => `${id} (${f.name})`).join(", ");
      const sys = `You convert a parent's free-text description of a baby's meal into structured JSON for a nutrition app. ` +
        `Valid food ids: ${foodList}. Valid units: piece, katori, bowl, cup, tsp, tbsp, glass. ` +
        `Respond with ONLY a JSON array, no prose, no markdown code fences. Each element must look like ` +
        `{"food": "<id from the valid list, or null if nothing matches well>", "rawFood": "<original words if food is null>", ` +
        `"qty": <number>, "unit": "<one of the valid units>", "pct": <integer 0-100, how much the baby ate; 100 if not mentioned>}. ` +
        `Interpret words like half=50, most/almost all=85, a little=15, some=50, all/finished=100, none/didn't eat=0.`;
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, system: sys, messages: [{ role: "user", content: aiText }] }),
      });
      const data = await resp.json();
      const textBlock = (data.content || []).find((b) => b.type === "text");
      if (!textBlock) throw new Error("empty response");
      const cleaned = textBlock.text.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(cleaned);
      setStaged(parsed.map((p) => ({
        food: p.food && FOOD_DB[p.food] ? p.food : null,
        rawFood: p.rawFood || "",
        qty: Number(p.qty) || 1,
        unit: ["piece", "katori", "bowl", "cup", "tsp", "tbsp", "glass"].includes(p.unit) ? p.unit : "katori",
        pct: Math.max(0, Math.min(100, Math.round(Number(p.pct)))) || 0,
      })));
    } catch (e) {
      setAiError("Couldn't structure that automatically — please add the items manually below instead.");
    } finally { setAiLoading(false); }
  }
  function updateStaged(idx, patch) { setStaged((prev) => prev.map((s, i) => (i === idx ? { ...s, ...patch } : s))); }
  function removeStaged(idx) { setStaged((prev) => prev.filter((_, i) => i !== idx)); }
  function confirmStaged() {
    const clean = staged.filter((s) => s.food).map((s) => ({ food: s.food, qty: s.qty, unit: s.unit, pct: s.pct }));
    setItems(clean); setStep("summary");
  }

  const offered = sumNutrients(items.map((it) => itemNutrients(it).offered));
  const consumed = sumNutrients(items.map((it) => itemNutrients(it).consumed));
  const rate = offered.kcal > 0 ? Math.round((consumed.kcal / offered.kcal) * 100) : 0;

  return (
    <div style={{ position: "absolute", inset: 0, background: COLORS.paper, zIndex: 20, display: "flex", flexDirection: "column" }}>
      <div style={{ padding: "16px 18px", borderBottom: `1px solid ${COLORS.border}`, display: "flex", alignItems: "center", gap: 10 }}>
        <button onClick={onClose} className="bgn-tap" style={{ background: "none", border: "none", cursor: "pointer" }}><ArrowLeft size={20} /></button>
        <div className="bgn-serif" style={{ fontSize: 16, fontWeight: 600 }}>Log a meal</div>
      </div>
      <div className="bgn-scroll" style={{ flex: 1, overflowY: "auto", padding: 18 }}>
        {step === "type" && (
          <div className="bgn-fade-in">
            <SectionLabel>What meal is this?</SectionLabel>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20 }}>
              {MEAL_TYPES.map((mt) => (
                <button key={mt.id} onClick={() => setMealType(mt.id)} className="bgn-tap"
                  style={{ padding: "16px 10px", borderRadius: 14, cursor: "pointer", fontWeight: 600, fontSize: 14,
                    border: `1.5px solid ${mealType === mt.id ? COLORS.primary : COLORS.border}`,
                    background: mealType === mt.id ? COLORS.primarySoft : "#fff", color: COLORS.ink }}>
                  {mt.label}
                </button>
              ))}
            </div>
            <PrimaryButton onClick={() => setStep("items")}>Continue</PrimaryButton>
          </div>
        )}

        {step === "items" && (
          <div className="bgn-fade-in">
            <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
              <button onClick={() => setMode("manual")} className="bgn-tap" style={{ flex: 1, padding: "9px 0", borderRadius: 10, cursor: "pointer", fontSize: 12.5, fontWeight: 600,
                border: `1px solid ${mode === "manual" ? COLORS.primary : COLORS.border}`, background: mode === "manual" ? COLORS.primary : "transparent", color: mode === "manual" ? "#fff" : COLORS.inkSoft }}>
                Add manually
              </button>
              <button onClick={() => setMode("ai")} className="bgn-tap" style={{ flex: 1, padding: "9px 0", borderRadius: 10, cursor: "pointer", fontSize: 12.5, fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center", gap: 5,
                border: `1px solid ${mode === "ai" ? COLORS.primary : COLORS.border}`, background: mode === "ai" ? COLORS.primary : "transparent", color: mode === "ai" ? "#fff" : COLORS.inkSoft }}>
                <Sparkles size={13} /> Describe in words
              </button>
            </div>

            {mode === "manual" && (
              <div>
                <Card style={{ marginBottom: 14 }}>
                  <SectionLabel>Food offered</SectionLabel>
                  <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                    <select value={draftFood} onChange={(e) => { setDraftFood(e.target.value); setDraftUnit(unitOptions(e.target.value)[0]); }}
                      style={{ flex: 1, padding: "9px 8px", borderRadius: 10, border: `1px solid ${COLORS.border}`, fontSize: 13, background: "#fff" }}>
                      {Object.entries(FOOD_DB).map(([id, f]) => <option key={id} value={id}>{f.name}</option>)}

              <Card key={i} style={{ marginBottom: 10 }}>

/* ============================================================================
   HOME SCREEN
============================================================================ */
function HomeScreen({ baby, growthResults, mealsByDay, todayOffset, ageMonths, viewMode, onNavigate }) {
  const latest = growthResults[growthResults.length - 1];
  const first = growthResults[0];
  const today = mealsByDay.find((d) => d.offset === todayOffset);
  const totals = sumNutrients(today.meals.flatMap((m) => m.items).map((it) => itemNutrients(it).consumed));
  const ref = referenceForAge(ageMonths);

  const last7 = mealsByDay.slice(-7);
  const avgIron = last7.length ? last7.reduce((s, d) => s + sumNutrients(d.meals.flatMap((m) => m.items).map((it) => itemNutrients(it).consumed)).iron, 0) / last7.length : 0;
  const ironCoveragePct = Math.round((avgIron / ref.iron) * 100);
  const weightDelta = latest.zWeight - first.zWeight;
  const singlePoint = growthResults.length < 2;
  const trendText = singlePoint
    ? "First measurement recorded. Add another over time to see a trend."
    : Math.abs(weightDelta) > 0.6
    ? "Weight trajectory has trended downward over the recorded period, while length and head circumference have stayed closer to birth trajectory."
    : "Growth trajectory has remained relatively stable over the recorded period.";
  const missingToday = MEAL_TYPES.filter((mt) => !today.meals.some((m) => m.type === mt.id));

  return (
    <div className="bgn-fade-in">
      <div className="bgn-grid-bg" style={{ borderRadius: 18, padding: "18px 16px", marginBottom: 16, border: `1px solid ${COLORS.border}`, background: COLORS.paperRaised }}>
        <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 2 }}>{baby.name} · {round1(ageMonths)} months · {baby.sex === "M" ? "Boy" : "Girl"}</div>
        <div className="bgn-serif" style={{ fontSize: 19, fontWeight: 600, marginBottom: 12 }}>What has changed since last time?</div>
        <div style={{ display: "flex", gap: 8 }}>
          <GrowthOverviewCard label="Weight" percentile={latest.pWeight} z={latest.zWeight} trend={weightDelta < -0.2 ? "down" : weightDelta > 0.2 ? "up" : "flat"} viewMode={viewMode} onClick={() => onNavigate("growth")} />
          <GrowthOverviewCard label="Length" percentile={latest.pLength} z={latest.zLength} trend="flat" viewMode={viewMode} onClick={() => onNavigate("growth")} />
          <GrowthOverviewCard label="Head circ." percentile={latest.pHc} z={latest.zHc} trend="flat" viewMode={viewMode} onClick={() => onNavigate("growth")} />
        </div>
      </div>

      <Card style={{ marginBottom: 14 }}>
        <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 10 }}>Today's nutrition</div>
        <div style={{ display: "flex", gap: 18, marginBottom: 12 }}>
          <div><div className="bgn-serif" style={{ fontSize: 20, fontWeight: 600 }}>{round0(totals.kcal)}</div><div style={{ fontSize: 10.5, color: COLORS.inkFaint }}>kcal</div></div>
          <div><div className="bgn-serif" style={{ fontSize: 20, fontWeight: 600 }}>{round1(totals.protein)}g</div><div style={{ fontSize: 10.5, color: COLORS.inkFaint }}>protein</div></div>
          <div><div className="bgn-serif" style={{ fontSize: 20, fontWeight: 600 }}>{round1(totals.iron)}mg</div><div style={{ fontSize: 10.5, color: COLORS.inkFaint }}>iron</div></div>
        </div>
        <TodayMealList meals={today.meals} />
        <button onClick={() => onNavigate("nutrition")} className="bgn-tap" style={{ marginTop: 12, background: "none", border: "none", color: COLORS.primary, fontSize: 12.5, fontWeight: 600, display: "flex", alignItems: "center", gap: 3, cursor: "pointer", padding: 0 }}>
          Log food <ChevronRight size={14} />
        </button>
      </Card>

      <Card accent={COLORS.primary} style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.primaryDeep, marginBottom: 4 }}>Recent trend</div>
        <div style={{ fontSize: 13, color: COLORS.ink, lineHeight: 1.5 }}>{trendText}</div>
      </Card>

      {missingToday.length > 0 && missingToday.length < 4 ? (
        <Card accent={COLORS.accent}>
          <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
            <AlertCircle size={16} color="#8A5A16" style={{ marginTop: 1 }} />
            <div style={{ fontSize: 12.5, color: "#5C3E10", lineHeight: 1.5 }}>Food log incomplete today — {missingToday.map((m) => m.label).join(", ")} not yet logged.</div>
          </div>
        </Card>
      ) : (last7.length >= 3 && ironCoveragePct < 70) ? (
        <Card accent={COLORS.attention}>
          <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
            <AlertCircle size={16} color={COLORS.attention} style={{ marginTop: 1 }} />
            <div style={{ fontSize: 12.5, color: COLORS.attention, lineHeight: 1.5 }}>
              Recorded iron intake has averaged {ironCoveragePct}% of the selected reference over the last {last7.length} days.
            </div>
          </div>
        </Card>
      ) : null}
    </div>
  );
}

/* ============================================================================
   TIMELINE
============================================================================ */
function TimelineScreen({ growthResults, mealsByDay, ageMonths, viewMode }) {
  const ref = referenceForAge(ageMonths);
  return (
    <div className="bgn-fade-in">
      <div style={{ position: "relative", paddingLeft: 18 }}>
        <div style={{ position: "absolute", left: 5, top: 6, bottom: 6, width: 2, background: COLORS.border }} />
        {growthResults.map((g, idx) => {
          const isLatest = idx === growthResults.length - 1;
          let nutritionAvg = null;
          if (isLatest && mealsByDay.length > 0) {
            const avg = sumNutrients(mealsByDay.flatMap((d) => d.meals.flatMap((m) => m.items)).map((it) => itemNutrients(it).consumed));
            Object.keys(avg).forEach((k) => (avg[k] = avg[k] / mealsByDay.length));
            nutritionAvg = avg;
          }
          return (
            <div key={g.ageMonths} style={{ position: "relative", marginBottom: 22 }}>
              <div style={{ position: "absolute", left: -18, top: 3, width: 12, height: 12, borderRadius: "50%", background: isLatest ? COLORS.accent : COLORS.primary, border: "2px solid " + COLORS.paper }} />
              <div style={{ fontWeight: 600, fontSize: 13.5, marginBottom: 6 }}>{g.label}</div>
              <div style={{ display: "flex", gap: 14, fontSize: 12, color: COLORS.inkSoft, marginBottom: nutritionAvg ? 6 : 0, flexWrap: "wrap" }}>
                <span>Wt {g.weight}kg <span style={{ color: COLORS.inkFaint }}>({ordinal(g.pWeight)}{viewMode === "clinical" ? `, Z${g.zWeight >= 0 ? "+" : ""}${round1(g.zWeight)}` : ""})</span></span>
                <span>Ln {g.length}cm <span style={{ color: COLORS.inkFaint }}>({ordinal(g.pLength)})</span></span>
                <span>HC {g.hc}cm <span style={{ color: COLORS.inkFaint }}>({ordinal(g.pHc)})</span></span>
              </div>
              {nutritionAvg ? (
                <div style={{ fontSize: 11.5, color: COLORS.inkFaint, background: COLORS.paperRaised, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "7px 10px", display: "inline-block" }}>
                  Avg over {mealsByDay.length} logged days: ~{round0(nutritionAvg.kcal)} kcal ({Math.round((nutritionAvg.kcal / ref.kcal) * 100)}% of reference) · iron {round1(nutritionAvg.iron)}mg ({Math.round((nutritionAvg.iron / ref.iron) * 100)}%)
                </div>
              ) : (
                <div style={{ fontSize: 11, color: COLORS.inkFaint, fontStyle: "italic" }}>No nutrition log for this period</div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================================
   GROWTH + NUTRITION CONNECTION
============================================================================ */
function ConnectScreen({ growthResults, mealsByDay, ageMonths }) {
  const ref = referenceForAge(ageMonths);
  const hasMeals = mealsByDay.length > 0;
  const avg = hasMeals ? sumNutrients(mealsByDay.flatMap((d) => d.meals.flatMap((m) => m.items)).map((it) => itemNutrients(it).consumed)) : { kcal: 0, iron: 0 };
  if (hasMeals) Object.keys(avg).forEach((k) => (avg[k] = avg[k] / mealsByDay.length));
  const latest = growthResults[growthResults.length - 1];
  const first = growthResults[0];
  const weightDelta = latest.zWeight - first.zWeight;
  const ironPct = Math.round((avg.iron / ref.iron) * 100);
  const energyPct = Math.round((avg.kcal / ref.kcal) * 100);

  const insight = !hasMeals
    ? "Log a few days of meals to see how nutrition compares with the growth trend."
    : (Math.abs(weightDelta) > 0.6 && ironPct < 75)
    ? `Weight trajectory has changed over the recorded period. The nutrition log over the last ${mealsByDay.length} days also shows recorded iron intake averaging ${ironPct}% of the selected reference. These observations do not establish a cause, but may be useful to discuss with your pediatrician.`
    : "No strong pattern linking the recorded growth trend and nutrition log stands out yet. Keep logging — the more data recorded, the more meaningful this comparison becomes.";

  return (
    <div className="bgn-fade-in">
      {hasMeals && (
        <Card style={{ marginBottom: 14 }}>
          <SectionLabel>Last {mealsByDay.length} days</SectionLabel>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
            <div>
              <div style={{ fontSize: 11.5, color: COLORS.inkSoft }}>Avg. energy</div>
              <div className="bgn-serif" style={{ fontSize: 20, fontWeight: 600 }}>{energyPct}%</div>
              <div style={{ fontSize: 10.5, color: COLORS.inkFaint }}>of reference</div>
            </div>
            <div>
              <div style={{ fontSize: 11.5, color: COLORS.inkSoft }}>Avg. iron</div>
              <div className="bgn-serif" style={{ fontSize: 20, fontWeight: 600, color: ironPct < 75 ? COLORS.attention : COLORS.ink }}>{ironPct}%</div>
              <div style={{ fontSize: 10.5, color: COLORS.inkFaint }}>of reference</div>
            </div>
          </div>
        </Card>
      )}

      <Card accent={ironPct < 75 && hasMeals ? COLORS.attention : COLORS.primary} style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6, color: COLORS.ink }}>What this may mean</div>
        <div style={{ fontSize: 13, color: COLORS.ink, lineHeight: 1.6 }}>{insight}</div>
      </Card>
      {hasMeals && <GhostButton icon={FileText} style={{ width: "100%" }}>Discuss with pediatrician</GhostButton>}
    </div>
  );
}

            <div style={{ fontSize: 12.5, lineHeight: 1.9 }}>
              Estimated energy: {round0(avg.kcal)} kcal ({Math.round((avg.kcal / ref.kcal) * 100)}% of ICMR-NIN RDA)<br />
              Protein: {round1(avg.protein)} g · Iron: {round1(avg.iron)} mg ({Math.round((avg.iron / ref.iron) * 100)}%) · Calcium: {round0(avg.calcium)} mg ({Math.round((avg.calcium / ref.calcium) * 100)}%)
            </div>
          </Card>
        )}
        <Card style={{ marginBottom: 12 }}>
          <SectionLabel>Data quality</SectionLabel>
          <div style={{ fontSize: 12.5, lineHeight: 1.9 }}>
            Measurements logged: {growthResults.length} ({growthResults.filter((m) => m.confidence === "High").length} clinic/hospital, {growthResults.filter((m) => m.confidence === "Medium").length} parent/home)<br />
            Meals logged: {totalMeals} across {mealsByDay.length} days. All nutrition figures are estimates, not measured intake.
          </div>
        </Card>
        <Card accent={COLORS.primary} style={{ marginBottom: 12 }}>
          <SectionLabel>Important observation</SectionLabel>
          <div style={{ fontSize: 12.5, lineHeight: 1.6 }}>
            {growthResults.length > 1 && Math.abs(weightDelta) > 0.6
              ? `Weight-for-age Z-score decreased from ${round1(first.zWeight)} to ${round1(latest.zWeight)} over the recorded period, while length-for-age and head-circumference-for-age have stayed relatively stable.`
              : "No large shift in weight-, length-, or head-circumference-for-age Z-scores was recorded over this period."}
          </div>
        </Card>
        <div style={{ fontSize: 11, color: COLORS.inkFaint, lineHeight: 1.6, marginBottom: 20 }}>
          Generated from parent-recorded measurements and meal logs. Not a diagnosis — intended to support, not replace, clinical assessment.
        </div>
      </div>
    </div>
  );
}

function ProfileScreen({ baby, growthResults, mealsByDay, ageMonths, viewMode, onViewModeChange, patientCode, role, onUnlink }) {
  const [reportOpen, setReportOpen] = useState(false);
  const [showMethod, setShowMethod] = useState(false);
  return (
    <div className="bgn-fade-in" style={{ position: "relative", minHeight: "100%" }}>
      <Card style={{ marginBottom: 14 }}>
        <SectionLabel>Baby profile</SectionLabel>
        <div style={{ fontSize: 13, lineHeight: 1.9 }}>
          Name: <strong>{baby.name}</strong> · Sex: {baby.sex === "M" ? "Boy" : "Girl"}<br />
          Gestational age at birth: {baby.gestationalAgeWeeks} weeks ({baby.preterm ? "Preterm" : "Term"})<br />
          {baby.birthWeight && <>Birth weight / length / HC: {baby.birthWeight} kg / {baby.birthLength} cm / {baby.birthHc} cm<br /></>}
          {patientCode && <>Patient ID: <strong>{patientCode}</strong></>}
        </div>
      </Card>

      <Card style={{ marginBottom: 14 }}>
        <SectionLabel>Who's viewing</SectionLabel>
        <div style={{ display: "flex", gap: 8 }}>
          {[{ id: "parent", label: "Parent view", icon: Heart }, { id: "clinical", label: "Clinical view", icon: Stethoscope }].map((o) => (
            <button key={o.id} onClick={() => onViewModeChange(o.id)} className="bgn-tap"
              style={{ flex: 1, padding: "11px 0", borderRadius: 12, cursor: "pointer", fontWeight: 600, fontSize: 13, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                border: `1.5px solid ${viewMode === o.id ? COLORS.primary : COLORS.border}`, background: viewMode === o.id ? COLORS.primarySoft : "#fff", color: COLORS.ink }}>
              <o.icon size={14} /> {o.label}
            </button>
          ))}
        </div>
        <div style={{ fontSize: 11.5, color: COLORS.inkFaint, marginTop: 8, lineHeight: 1.5 }}>
          Clinical view adds Z-scores, raw values and data-source tags for hospital staff. Parent view keeps the same data in plain language.
        </div>
      </Card>

      <Card style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 10, lineHeight: 1.5 }}>
          Generate a one-page summary of growth, nutrition and data quality to share with a pediatrician or dietitian.
        </div>
        <GhostButton icon={FileText} style={{ width: "100%" }} onClick={() => setReportOpen(true)}>Generate pediatrician report</GhostButton>
      </Card>

      <Card>
        <button onClick={() => setShowMethod((s) => !s)} className="bgn-tap" style={{ width: "100%", background: "none", border: "none", display: "flex", justifyContent: "space-between", cursor: "pointer", padding: 0 }}>
          <span style={{ fontWeight: 600, fontSize: 13.5 }}>Data sources &amp; methodology</span>
          <ChevronDown size={17} style={{ transform: showMethod ? "rotate(180deg)" : "none" }} />
        </button>
        {showMethod && (
          <div className="bgn-fade-in" style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 10, lineHeight: 1.7 }}>
            <strong>Growth:</strong> WHO Child Growth Standards (2006) LMS reference tables, 0–24 months, official published parameters — weight-for-age, length-for-age, head-circumference-for-age, weight-for-length, and BMI-for-age. BMI is calculated automatically as weight ÷ height² from the same two measurements you already enter — no extra input needed.<br /><br />
            <strong>Nutrition reference targets:</strong> ICMR–National Institute of Nutrition, "Nutrient Requirements for Indians: RDA &amp; EAR 2020." These are full daily RDAs; breast milk/formula typically covers part of the total, so under-100% coverage from food alone is expected.<br /><br />
            <strong>Food composition:</strong> informed by ICMR-NIN's Indian Food Composition Tables (IFCT 2017) methodology for raw ingredients, converted to as-cooked values using standard cooking-yield factors. IFCT 2017 covers 528 raw commodities only — composite dishes (khichdi, idli, dosa, roti) are recipe-level estimates, not direct IFCT entries.<br /><br />
            <strong>Licensing note:</strong> IFCT 2017 permits personal-use reproduction, but embedding its data in a product requires NIN's written permission. A production build of this app would need a proper data licence or API from NIN rather than these prototype figures.<br /><br />
            <strong>Confidence &amp; source:</strong> every measurement and meal item is tagged with where it came from and a confidence level, visible in Clinical view.
          </div>
        )}
      </Card>

      {role === "parent" && (
        <Card style={{ marginTop: 14 }}>
          <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 10, lineHeight: 1.5 }}>
            Linked the wrong child, or want to start over on this device?
          </div>
          <GhostButton onClick={onUnlink} style={{ width: "100%" }}>Unlink this child</GhostButton>
        </Card>
      )}

      {reportOpen && <ReportView baby={baby} growthResults={growthResults} mealsByDay={mealsByDay} ageMonths={ageMonths} onClose={() => setReportOpen(false)} />}
    </div>
  );
}

/* ============================================================================
   NAVIGATION
============================================================================ */
const TABS = [
  { id: "home", label: "Home", icon: Home },
  { id: "growth", label: "Growth", icon: Activity },
  { id: "nutrition", label: "Nutrition", icon: Utensils },
  { id: "connect", label: "Connect", icon: TrendingUp },
  { id: "timeline", label: "Timeline", icon: History },
  { id: "profile", label: "Profile", icon: User },
];
function BottomNav({ active, onChange }) {
  return (
    <div style={{ display: "flex", borderTop: `1px solid ${COLORS.border}`, background: COLORS.paperRaised, padding: "6px 2px 8px" }}>
      {TABS.map((t) => {
        const Icon = t.icon;
        const isActive = active === t.id;
        return (
          <button key={t.id} onClick={() => onChange(t.id)} className="bgn-tap"
            style={{ flex: 1, background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "6px 0" }}>
            <Icon size={19} color={isActive ? COLORS.primary : COLORS.inkFaint} strokeWidth={isActive ? 2.4 : 2} />
            <span style={{ fontSize: 9.5, fontWeight: isActive ? 700 : 500, color: isActive ? COLORS.primary : COLORS.inkFaint }}>{t.label}</span>
          </button>
        );
      })}
    </div>
  );
}

/* ============================================================================
   ROOT APP — state machine: welcome → onboarding (profile → measurement →
   result) → main app. "See a demo" skips straight to main with seed data.
============================================================================ */
function App() {
  const [role, setRole] = useState(() => getStoredRole());
  const [patients, setPatients] = useState(() => loadPatients());
  const [stage, setStage] = useState(() => {
    const r = getStoredRole();
    if (r === "staff") return "staff-roster";
    if (r === "parent") {
      const myId = getMyPatientId();
      const found = myId && loadPatients().some((p) => p.id === myId);
      return found ? "dashboard" : "parent-link";
    }
    return "role";
  });
  const [activePatientId, setActivePatientId] = useState(() => {
    if (getStoredRole() === "parent") return getMyPatientId();
    return null;
  });
  const [demoActive, setDemoActive] = useState(false);
  const [demoMeasurements, setDemoMeasurements] = useState(DEMO_MEASUREMENTS);
  const [demoMeals, setDemoMeals] = useState(() =>
    DEMO_MEAL_LOG_RAW.map((d) => ({ offset: d.offset, meals: d.meals.map((m) => ({ ...m, items: m.items.map(enrichItem) })) }))
  );

  const [tab, setTab] = useState("home");
  const [viewMode, setViewMode] = useState("parent");
  const [pendingProfile, setPendingProfile] = useState(null);
  const [pendingResult, setPendingResult] = useState(null);
  const [onboardContext, setOnboardContext] = useState(null); // "staff" | "parent"
  const [linkCode, setLinkCode] = useState("");
  const [linkError, setLinkError] = useState("");
  const [addMeasurementOpen, setAddMeasurementOpen] = useState(false);

  const todayOffset = 0;

  function persistPatients(next) { setPatients(next); savePatients(next); }

  function chooseRole(r) {
    setStoredRole(r);
    setRole(r);
    if (r === "staff") { setStage("staff-roster"); return; }
    const myId = getMyPatientId();
    if (myId && patients.some((p) => p.id === myId)) {
      setActivePatientId(myId); setDemoActive(false); setViewMode("parent"); setTab("home"); setStage("dashboard");
    } else {
      setStage("parent-link");
    }
  }
  function switchRole() {
    clearStoredRole();
    setRole(null); setActivePatientId(null); setDemoActive(false); setStage("role");
  }

  function startOnboarding(context) { setOnboardContext(context); setStage("onboard-profile"); }
  function loadDemo() { setDemoActive(true); setActivePatientId(null); setViewMode(role === "staff" ? "clinical" : "parent"); setTab("home"); setStage("dashboard"); }
  function exitDemo() { setDemoActive(false); setStage(role === "staff" ? "staff-roster" : "parent-link"); }

  function handleLinkSubmit() {
    const code = linkCode.trim().toUpperCase();
    const found = patients.find((p) => p.code === code);
    if (!found) { setLinkError("No patient found with that ID. Check with your hospital, or register below."); return; }
    setMyPatientId(found.id);
    setActivePatientId(found.id); setDemoActive(false); setViewMode("parent"); setTab("home");
    setLinkError(""); setStage("dashboard");
  }

  function handleProfileNext(profile) { setPendingProfile(profile); setStage("onboard-measurement"); }
  function handleMeasurementSubmit(m) {
    const ageMonths = ageInMonths(pendingProfile.dob, m.date);
    const correctedMonths = correctedAgeMonths(ageMonths, pendingProfile.gestationalAgeWeeks, pendingProfile.preterm);
    const growth = computeGrowth(pendingProfile.sex, correctedMonths, m.weight, m.length, m.hc);
    const patientCode = onboardContext === "staff" ? generatePatientCode(patients.map((p) => p.code)) : null;
    setPendingResult({ m, ageMonths, correctedMonths, growth, patientCode });
    setStage("onboard-result");
  }
  function handleResultContinue() {
    const id = newPatientId();
    const code = pendingResult.patientCode || generatePatientCode(patients.map((p) => p.code));
    const newPatient = {
      id, code, baby: { ...pendingProfile },
      measurements: [{
        ageMonths: round1(pendingResult.ageMonths), label: `${round1(pendingResult.ageMonths)} months`,
        weight: pendingResult.m.weight, length: pendingResult.m.length, hc: pendingResult.m.hc,
        source: onboardContext === "staff" ? "Clinic visit" : "Parent entered",
        confidence: onboardContext === "staff" ? "High" : "Medium",
      }],
      mealsByDay: [{ offset: 0, meals: [] }],
      registeredBy: onboardContext,
    };
    persistPatients([...patients, newPatient]);
    setActivePatientId(id); setDemoActive(false);
    if (onboardContext === "parent") { setMyPatientId(id); setViewMode("parent"); }
    else { setViewMode("clinical"); }
    setTab("home"); setStage("dashboard");
  }

  function handleAddMeasurementSave(newMeasurement) {
    if (demoActive) {
      setDemoMeasurements((prev) => [...prev, newMeasurement].sort((a, b) => a.ageMonths - b.ageMonths));
    } else {
      const next = patients.map((p) => (p.id === activePatientId
        ? { ...p, measurements: [...p.measurements, newMeasurement].sort((a, b) => a.ageMonths - b.ageMonths) }
        : p));
      persistPatients(next);
    }
    setAddMeasurementOpen(false);
  }
  function handleAddMeal(meal) {
    const withItems = { ...meal, items: meal.items.map(enrichItem) };
    if (demoActive) {
      setDemoMeals((prev) => {
        const exists = prev.some((d) => d.offset === todayOffset);
        if (!exists) return [...prev, { offset: todayOffset, meals: [withItems] }];
        return prev.map((d) => (d.offset === todayOffset ? { ...d, meals: [...d.meals, withItems] } : d));
      });
    } else {
      const next = patients.map((p) => {
        if (p.id !== activePatientId) return p;
        const exists = p.mealsByDay.some((d) => d.offset === todayOffset);
        const mealsByDay = exists
          ? p.mealsByDay.map((d) => (d.offset === todayOffset ? { ...d, meals: [...d.meals, withItems] } : d))
          : [...p.mealsByDay, { offset: todayOffset, meals: [withItems] }];
        return { ...p, mealsByDay };
      });
      persistPatients(next);
    }
  }
  function handleUnlink() {
    clearStoredRole();
    setStoredRole("parent"); setRole("parent");
    setActivePatientId(null); setStage("parent-link");
  }

  const activePatient = demoActive ? { baby: DEMO_BABY } : patients.find((p) => p.id === activePatientId);
  const baby = demoActive ? DEMO_BABY : activePatient?.baby;
  const measurements = demoActive ? demoMeasurements : (activePatient?.measurements || []);
  const mealsByDay = demoActive ? demoMeals : (activePatient?.mealsByDay || []);
  const patientCode = demoActive ? "DEMO01" : activePatient?.code;

  const growthResults = useMemo(() => {
    if (!baby) return [];
    return measurements.map((m) => {
      const g = computeGrowth(baby.sex, m.ageMonths, m.weight, m.length, m.hc);
      return { ...m, ...g };
    });
  }, [measurements, baby]);

  const currentAgeMonths = baby ? ageInMonths(baby.dob, todayISO()) : 0;

  const shellStyle = { width: "100%", maxWidth: 430, background: COLORS.paper, borderRadius: 22, overflow: "hidden", boxShadow: "0 8px 30px rgba(35,42,34,0.18)", display: "flex", flexDirection: "column", height: "min(860px, 92vh)", position: "relative" };

  const preDashboardStages = ["role", "staff-roster", "parent-link", "onboard-profile", "onboard-measurement", "onboard-result"];
  if (preDashboardStages.includes(stage)) {
    return (
      <div className="bgn-root" style={{ minHeight: "100vh", background: "#E8E3D6", display: "flex", justifyContent: "center", padding: "16px 0" }}>
        <style>{GLOBAL_CSS}</style>
        <div style={shellStyle}>
          <div className="bgn-scroll" style={{ flex: 1, overflowY: "auto", padding: 22 }}>
            {stage === "role" && <RoleScreen onChoose={chooseRole} />}
            {stage === "staff-roster" && (
              <StaffRoster patients={patients} onSelectPatient={(id) => { setActivePatientId(id); setDemoActive(false); setViewMode("clinical"); setTab("home"); setStage("dashboard"); }}
                onRegister={() => startOnboarding("staff")} onViewDemo={loadDemo} onSwitchRole={switchRole} />
            )}
            {stage === "parent-link" && (
              <ParentLinkScreen code={linkCode} setCode={setLinkCode} error={linkError} onLink={handleLinkSubmit}
                onRegisterSelf={() => startOnboarding("parent")} onViewDemo={loadDemo} onSwitchRole={switchRole} />
            )}
            {stage === "onboard-profile" && <ProfileFormScreen onNext={handleProfileNext} onBack={() => setStage(onboardContext === "staff" ? "staff-roster" : "parent-link")} />}
            {stage === "onboard-measurement" && <MeasurementFormScreen baby={pendingProfile} onSubmit={handleMeasurementSubmit} onBack={() => setStage("onboard-profile")} />}
            {stage === "onboard-result" && pendingResult && (
              <ResultScreen baby={pendingProfile} measurement={pendingResult.m} growth={pendingResult.growth}
                ageMonths={pendingResult.ageMonths} correctedMonths={pendingResult.correctedMonths} onContinue={handleResultContinue}
                continueLabel={onboardContext === "staff" ? "View patient dashboard" : "Continue to dashboard"}
                patientCode={pendingResult.patientCode} />
            )}
          </div>
        </div>
      </div>
    );
  }

  const screens = {
    home: <HomeScreen baby={baby} growthResults={growthResults} mealsByDay={mealsByDay} todayOffset={todayOffset} ageMonths={currentAgeMonths} viewMode={viewMode} onNavigate={setTab} />,
    growth: <GrowthScreen baby={baby} growthResults={growthResults} viewMode={viewMode} onAddMeasurement={() => setAddMeasurementOpen(true)} />,
    nutrition: <NutritionScreen ageMonths={currentAgeMonths} mealsByDay={mealsByDay} onAddMeal={handleAddMeal} todayOffset={todayOffset} viewMode={viewMode} />,
    connect: <ConnectScreen growthResults={growthResults} mealsByDay={mealsByDay} ageMonths={currentAgeMonths} />,
    timeline: <TimelineScreen growthResults={growthResults} mealsByDay={mealsByDay} ageMonths={currentAgeMonths} viewMode={viewMode} />,
    profile: <ProfileScreen baby={baby} growthResults={growthResults} mealsByDay={mealsByDay} ageMonths={currentAgeMonths} viewMode={viewMode}
      onViewModeChange={setViewMode} patientCode={demoActive ? undefined : patientCode} role={role} onUnlink={handleUnlink} />,
  };

  return (
    <div className="bgn-root" style={{ minHeight: "100vh", background: "#E8E3D6", display: "flex", justifyContent: "center", padding: "16px 0" }}>
      <style>{GLOBAL_CSS}</style>
      <div style={shellStyle}>
        <div style={{ padding: "14px 18px 10px", display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: `1px solid ${COLORS.border}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            {(role === "staff" && !demoActive) || demoActive ? (
              <button onClick={demoActive ? exitDemo : () => setStage("staff-roster")} className="bgn-tap"
                style={{ background: "none", border: "none", cursor: "pointer", padding: 4, marginLeft: -4 }}>
                <ArrowLeft size={17} color={COLORS.inkSoft} />
              </button>
            ) : null}
            <div>
              <div className="bgn-serif" style={{ fontSize: 15, fontWeight: 600 }}>{baby.name}'s overview{demoActive ? " (demo)" : ""}</div>
              <div style={{ fontSize: 11, color: COLORS.inkFaint }}>{round1(currentAgeMonths)} months</div>
            </div>
          </div>
          <button onClick={() => setViewMode((v) => (v === "parent" ? "clinical" : "parent"))} className="bgn-tap"
            style={{ display: "flex", alignItems: "center", gap: 5, background: COLORS.primarySoft, border: "none", borderRadius: 999, padding: "6px 12px", cursor: "pointer" }}>
            {viewMode === "parent" ? <Heart size={12} color={COLORS.primaryDeep} /> : <Stethoscope size={12} color={COLORS.primaryDeep} />}
            <span style={{ fontSize: 11, fontWeight: 600, color: COLORS.primaryDeep }}>{viewMode === "parent" ? "Parent view" : "Clinical view"}</span>
          </button>
        </div>
        <div className="bgn-scroll" style={{ flex: 1, overflowY: "auto", padding: 16, position: "relative" }}>
          {screens[tab]}
        </div>
        <BottomNav active={tab} onChange={setTab} />
        {addMeasurementOpen && <AddMeasurementFlow baby={baby} onClose={() => setAddMeasurementOpen(false)} onSave={handleAddMeasurementSave} />}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<script>
(function () {
  // Defensive check: if a CDN script failed to load (network issue, ad-blocker,
  // restrictive CSP, etc.) show a clear message instead of a cryptic console error.
  var missing = [];
  if (typeof React === "undefined") missing.push("React");
  if (typeof ReactDOM === "undefined") missing.push("ReactDOM");
  if (typeof Recharts === "undefined") missing.push("Recharts");
  if (typeof Babel === "undefined") missing.push("Babel");
  if (missing.length) {
    document.getElementById("root").innerHTML =
      '<div style="max-width:420px;margin:60px auto;padding:20px;font-family:system-ui,sans-serif;' +
      'color:#5C3E10;background:#F8E8D2;border-radius:12px;line-height:1.6;">' +
      '<strong>Couldn\u2019t load a required library: ' + missing.join(", ") + '.</strong><br/><br/>' +
      "This usually means a CDN script was blocked (ad-blocker, offline, or a restrictive " +
      "network/proxy). Try reloading, checking your connection, or opening this file in a " +
      "different browser/network.</div>";
    return;
  }
  var source = document.getElementById("app-source").textContent;
  // Classic runtime: emits React.createElement(...) calls, which work with the
  // global `React` from the UMD build above -- no ES module resolver needed.
  var output = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] }).code;
  var script = document.createElement("script");
  script.textContent = output;
  document.body.appendChild(script);
})();
</script>
